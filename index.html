<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบสั่งซื้อสินค้า</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #fff; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        button:hover { background: #218838; }
        .tracking-btn { display: block; background: #007bff; color: white; text-align: center; padding: 12px; border-radius: 4px; text-decoration: none; font-size: 16px; margin-top: 15px; }
        .tracking-btn:hover { background: #0056b3; }
        #summary { display: none; background: #e9ecef; padding: 20px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบฟอร์มสั่งซื้อสินค้า</h2>
    
    <form id="orderForm" onsubmit="submitOrder(event)">
        <div class="form-group">
            <label>1. รายการสินค้า (พิมพ์ชื่อสินค้าและรายละเอียด)</label>
            <input type="text" id="product" placeholder="เช่น Usb C-L 1ชิ้น" required>
        </div>
        <div class="form-group">
            <label>จำนวนยอดเงินที่โอน (บาท)</label>
            <input type="number" id="amount" placeholder="เช่น 580" required>
        </div>
        <div class="form-group">
            <label>รูปแบบการชำระเงิน / การจัดส่ง</label>
            <select id="shippingType" required>
                <option value="" disabled selected>-- กรุณาเลือกรูปแบบ --</option>
                <option value="ชำระแล้ว (โอนเงิน)">ชำระแล้ว (โอนเงิน)</option>
                <option value="เก็บเงินปลายทาง">เก็บเงินปลายทาง</option>
            </select>
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล ผู้รับ</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
            <label>ที่อยู่จัดส่ง</label>
            <textarea id="address" rows="3" required></textarea>
        </div>
        <div class="form-group">
            <label>อัพโหลดสลิปโอนเงิน (ถ้ามี)</label>
            <input type="file" id="slip" accept="image/*">
        </div>
        <div class="form-group">
            <label>หมายเหตุถึงร้านค้า (ถ้ามี)</label>
            <textarea id="note" rows="2" placeholder="เช่น ฝากไว้ที่นิติบุคคล, ส่งของรอบบ่าย"></textarea>
        </div>
        <button type="submit" id="submitBtn">ยืนยันการสั่งซื้อ</button>
    </form>

    <div id="summary">
        <h3>สั่งซื้อสำเร็จ! สรุปรายการของคุณ</h3>
        <p><strong>รหัสคำสั่งซื้อ:</strong> <span id="sum-id"></span></p>
        <p><strong>ชื่อผู้รับ:</strong> <span id="sum-name"></span></p>
        <p><strong>เบอร์โทร:</strong> <span id="sum-phone"></span></p>
        <p><strong>ที่อยู่:</strong> <span id="sum-address"></span></p>
        <p><strong>สินค้า:</strong> <span id="sum-product"></span></p>
        <p><strong>ยอดเงิน:</strong> <span id="sum-amount"></span> บาท</p>
        <p><strong>การจัดส่ง:</strong> <span id="sum-shipping"></span></p>
        <p><strong>หมายเหตุ:</strong> <span id="sum-note"></span></p>
        <p style="color: #28a745;">สถานะ: บันทึกคำสั่งซื้อเรียบร้อย</p>
        
        <!-- ปุ่มเช็คพัสดุจะแสดงเฉพาะตอนสั่งซื้อสำเร็จแล้วเท่านั้น -->
        <a href="https://script.google.com/macros/s/AKfycbwe6cU-d4KC0n9Um3Gh834WXJc6pT15HUJCljmNyYuxA3crgUmBt6toyjZWRdLtFqVj-g/exec" target="_blank" class="tracking-btn" style="background: #17a2b8;">
            🔍 เช็คเลขพัสดุของคุณที่นี่
        </a>
    </div>
</div>

<script>
function submitOrder(event) {
    event.preventDefault();
    
    let submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "กำลังส่งข้อมูล...";
    submitBtn.disabled = true;

    let orderId = 'ORD' + Math.floor(1000 + Math.random() * 9000);
    let product = document.getElementById('product').value;
    let amount = document.getElementById('amount').value;
    let shippingType = document.getElementById('shippingType').value;
    let name = document.getElementById('name').value;
    let phone = document.getElementById('phone').value;
    let address = document.getElementById('address').value;
    let note = document.getElementById('note').value;
    let fileInput = document.getElementById('slip');

    let file = fileInput.files[0];

    function sendDataToSheet(base64Data, slipName, slipType) {
        let payload = {
            orderId: orderId,
            product: product,
            amount: amount,
            shippingType: shippingType,
            name: name,
            phone: phone,
            address: address,
            note: note,
            slipName: slipName || "",
            slipType: slipType || "",
            slipData: base64Data || ""
        };

        // ⚠️ แทนที่ URL นี้ด้วย Web App URL ของ Google Sheets ฝั่งรับข้อมูลคำสั่งซื้อของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxG7DZ8uj8ya0JJv3wSdBvoEDRDf1LdTgATH7ZzUwItIRPrbIobzgPn0-vHjqWq8Uvq/exec";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('sum-id').innerText = orderId;
            document.getElementById('sum-product').innerText = product;
            document.getElementById('sum-amount').innerText = amount;
            document.getElementById('sum-shipping').innerText = shippingType;
            document.getElementById('sum-name').innerText = name;
            document.getElementById('sum-phone').innerText = phone;
            document.getElementById('sum-address').innerText = address;
            document.getElementById('sum-note').innerText = note ? note : "-";

            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('summary').style.display = 'block';
        }).catch(error => {
            alert('เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            submitBtn.innerText = "ยืนยันการสั่งซื้อ";
            submitBtn.disabled = false;
        });
    }

    if (file) {
        let reader = new FileReader();
        reader.onload = function(e) {
            let base64Data = e.target.result.split(',')[1];
            sendDataToSheet(base64Data, file.name, file.type);
        };
        reader.readAsDataURL(file);
    } else {
        sendDataToSheet("", "", "");
    }
}
</script>

</body>
</html>
